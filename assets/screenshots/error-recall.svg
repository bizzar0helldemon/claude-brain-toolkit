<svg xmlns="http://www.w3.org/2000/svg" width="820" height="404" viewBox="0 0 820 404" font-family="ui-monospace, 'SF Mono', 'Cascadia Code', 'JetBrains Mono', Menlo, Consolas, monospace" font-size="14">
<rect x="0" y="0" width="820" height="404" rx="12" fill="#0f1117" stroke="#262a38"/>
<rect x="0" y="0" width="820" height="38" rx="12" fill="#1c1f2b"/>
<rect x="0" y="20" width="820" height="18" fill="#1c1f2b"/>
<line x1="0" y1="38" x2="820" y2="38" stroke="#262a38"/>
<circle cx="22" cy="19" r="6" fill="#ff5f56"/>
<circle cx="42" cy="19" r="6" fill="#ffbd2e"/>
<circle cx="62" cy="19" r="6" fill="#27c93f"/>
<text x="410.0" y="24" text-anchor="middle" fill="#8a8a8a" font-size="12.5">error pattern recall — it remembers the fix</text>
<text x="26.0" y="74" fill="#5fd7af" xml:space="preserve">$ </text>
<text x="42.8" y="74" fill="#e6e6e6" xml:space="preserve">npm run build</text>
<text x="26.0" y="96" fill="#ff5f5f" xml:space="preserve">Error: </text>
<text x="84.8" y="96" fill="#e6e6e6" xml:space="preserve">ENOSPC: System limit for number of file watchers reached</text>
<text x="26.0" y="140" fill="#87afff" xml:space="preserve">▸ </text>
<text x="42.8" y="140" fill="#87afff" font-weight="700" xml:space="preserve">Brain: found past solution for this error</text>
<text x="387.2" y="140" fill="#8a8a8a" xml:space="preserve">  (seen 1× before)</text>
<text x="26.0" y="184" fill="#e6e6e6" xml:space="preserve">  I&#x27;ve hit this before. The fix that worked:</text>
<text x="26.0" y="228" fill="#6b7280" xml:space="preserve">    $ </text>
<text x="76.4" y="228" fill="#87d787" xml:space="preserve">echo fs.inotify.max_user_watches=524288 \</text>
<text x="26.0" y="250" fill="#87d787" xml:space="preserve">        | sudo tee -a /etc/sysctl.conf</text>
<text x="26.0" y="272" fill="#6b7280" xml:space="preserve">    $ </text>
<text x="76.4" y="272" fill="#87d787" xml:space="preserve">sudo sysctl -p</text>
<text x="26.0" y="316" fill="#8a8a8a" xml:space="preserve">  Raises the inotify watcher limit — the watcher-based</text>
<text x="26.0" y="338" fill="#8a8a8a" xml:space="preserve">  builder exhausts the default 8192 on large trees.</text>
</svg>