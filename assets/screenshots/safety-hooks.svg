<svg xmlns="http://www.w3.org/2000/svg" width="820" height="382" viewBox="0 0 820 382" font-family="ui-monospace, 'SF Mono', 'Cascadia Code', 'JetBrains Mono', Menlo, Consolas, monospace" font-size="14">
<rect x="0" y="0" width="820" height="382" rx="12" fill="#0f1117" stroke="#262a38"/>
<rect x="0" y="0" width="820" height="38" rx="12" fill="#1c1f2b"/>
<rect x="0" y="20" width="820" height="18" fill="#1c1f2b"/>
<line x1="0" y1="38" x2="820" y2="38" stroke="#262a38"/>
<circle cx="22" cy="19" r="6" fill="#ff5f56"/>
<circle cx="42" cy="19" r="6" fill="#ffbd2e"/>
<circle cx="62" cy="19" r="6" fill="#27c93f"/>
<text x="410.0" y="24" text-anchor="middle" fill="#8a8a8a" font-size="12.5">safety hooks — mistakes blocked before they run</text>
<text x="26.0" y="74" fill="#5fd7af" xml:space="preserve">$ </text>
<text x="42.8" y="74" fill="#e6e6e6" xml:space="preserve">git reset --hard origin/main</text>
<text x="26.0" y="96" fill="#ff5f5f" font-weight="700" xml:space="preserve">⛔ BLOCKED </text>
<text x="110.0" y="96" fill="#8a8a8a" xml:space="preserve">risk-classifier</text>
<text x="26.0" y="118" fill="#e6e6e6" xml:space="preserve">   Destructive: discards all uncommitted work.</text>
<text x="26.0" y="140" fill="#8a8a8a" xml:space="preserve">   Stash or commit first, then re-run intentionally.</text>
<text x="26.0" y="184" fill="#5fd7af" xml:space="preserve">$ </text>
<text x="42.8" y="184" fill="#e6e6e6" xml:space="preserve">git commit -m &quot;add config&quot;</text>
<text x="26.0" y="206" fill="#ff5f5f" font-weight="700" xml:space="preserve">⛔ BLOCKED </text>
<text x="110.0" y="206" fill="#8a8a8a" xml:space="preserve">pre-commit-secrets</text>
<text x="26.0" y="228" fill="#e6e6e6" xml:space="preserve">   Staged diff contains a secret:</text>
<text x="26.0" y="250" fill="#8a8a8a" xml:space="preserve">     config/prod.env:4  </text>
<text x="227.6" y="250" fill="#ffd75f" xml:space="preserve">AWS_SECRET_ACCESS_KEY=****</text>
<text x="26.0" y="272" fill="#8a8a8a" xml:space="preserve">   Remove it and add the file to .gitignore.</text>
<text x="26.0" y="316" fill="#87d787" xml:space="preserve">✓ </text>
<text x="42.8" y="316" fill="#8a8a8a" xml:space="preserve">Nothing destructive ran. No secret was committed.</text>
</svg>